name: XT Position Monitor

on:
  schedule:
    - cron: '*/2 * * * *'  # هر ۲ دقیقه
  workflow_dispatch:

concurrency:
  group: xt-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
        run: python monitor.txt

      - name: Commit state file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sent_positions.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || true
